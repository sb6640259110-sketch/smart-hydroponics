<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hydroponics Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 30px; 
            background-color: #f0f2f5; 
            color: #333;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { font-size: 1.1em; font-weight: 600; color: #555; }
        .val { font-weight: bold; font-size: 1.5em; color: #2e7d32; }
        h2 { text-align: center; color: #1b5e20; margin-bottom: 25px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌱 Smart Hydroponics Dashboard</h2>
        
        <div class="card">
            <span class="title">ค่า pH:</span>
            <span id="ph-val" class="val">กำลังโหลด...</span>
        </div>
        <div class="card">
            <span class="title">ค่า EC:</span>
            <span id="ec-val" class="val">กำลังโหลด...</span>
        </div>
        <div class="card">
            <span class="title">อุณหภูมิ:</span>
            <div><span id="temp-val" class="val">กำลังโหลด...</span> <span class="val">°C</span></div>
        </div>
    </div>

    <!-- Firebase Web SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      // Firebase Config ของโปรเจกต์ smart-hydroponics
      const firebaseConfig = {
        apiKey: "AIzaSyASNoyOXsEdjYa6-lKi44NHhcOVU0v4Eys",
        authDomain: "smart-hydroponics-7f95e.firebaseapp.com",
        databaseURL: "https://smart-hydroponics-7f95e-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "smart-hydroponics-7f95e",
        storageBucket: "smart-hydroponics-7f95e.firebasestorage.app",
        messagingSenderId: "272051111068",
        appId: "1:272051111068:web:f66c2046796387bc791959"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // ดักฟังการเปลี่ยนแปลงข้อมูลจาก Node: sensor_data
      database.ref('sensor_data').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          document.getElementById('ph-val').innerText = data.ph !== undefined ? data.ph : '-';
          document.getElementById('ec-val').innerText = data.ec !== undefined ? data.ec : '-';
          document.getElementById('temp-val').innerText = data.temp !== undefined ? data.temp : '-';
        }
      });
    </script>
</body>
</html>
